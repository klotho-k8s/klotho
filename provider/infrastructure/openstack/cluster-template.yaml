# klotho flat, cost-aware OpenStack (CAPO) cluster template.
#
# It is authored in the Cluster API v1beta2 contract. The CAPI-core objects
# (Cluster, KubeadmControlPlane, MachineDeployment, KubeadmConfigTemplate use
# apiGroup references, which is what klotho's generator requires). The OpenStack
# infrastructure objects are infrastructure.cluster.x-k8s.io/v1beta2, CAPO
# v0.15.x's storage version (and the version upstream's own v0.15.2 template
# uses), so flavor and image are the structured {filter:{name}} form.
#
# It is deliberately cheap to run:
#   * NO Octavia load balancer. The control plane endpoint is a Neutron floating
#     IP klotho allocated and associated with node zero
#     (spec.apiServer.floatingIP), so there is no standing Octavia cost. A single
#     control plane has no API-server redundancy; front it with your own Octavia
#     VIP (openstack.controlPlaneEndpoint) if you want HA.
#   * Bring-your-own network: an existing Neutron network (OPENSTACK_NETWORK_ID),
#     the same network klotho booted node zero on, so CAPO's machines land beside
#     it. klotho creates no network/subnet/router.
#   * NO cloud controller manager and NO in-tree cloud provider. The kubelet is
#     given its providerID directly (openstack:///<nova-uuid>), which is the only
#     thing Cluster API needs from the cloud provider to bind each Machine to its
#     Node. Apply a CNI after the API server is up; the node stays NotReady until
#     you do.
#
# The base image carries no Kubernetes, so create with klotho's install-at-boot
# (nodes.installKubernetes / --install-kubernetes).
#
# klotho fills CLUSTER_NAME, NAMESPACE, KUBERNETES_VERSION,
# CONTROL_PLANE_MACHINE_COUNT and WORKER_MACHINE_COUNT itself, and the OpenStack
# provider's Prepare fills OPENSTACK_CLOUD, OPENSTACK_NETWORK_ID,
# OPENSTACK_EXTERNAL_NETWORK_ID, OPENSTACK_CONTROL_PLANE_FLOATING_IP,
# OPENSTACK_IMAGE_NAME, OPENSTACK_CONTROL_PLANE_MACHINE_FLAVOR,
# OPENSTACK_NODE_MACHINE_FLAVOR, OPENSTACK_SSH_KEY_NAME and
# OPENSTACK_CLOUDS_YAML_B64 (the base64 clouds.yaml for the credential Secret).
#
# LIVE-VERIFY: the kubelet provider-id below is built from the Nova server UUID
# exposed to cloud-init as `ds.meta_data.uuid`. The exact instance-data key is
# the single item most likely to need adjustment on a real OpenStack cloud;
# see TESTING.md.
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: "${CLUSTER_NAME}"
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
      - 192.168.0.0/16
  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io
    kind: KubeadmControlPlane
    name: "${CLUSTER_NAME}-control-plane"
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: OpenStackCluster
    name: "${CLUSTER_NAME}"
---
# The clouds.yaml the in-cluster CAPO controller authenticates with. klotho fills
# OPENSTACK_CLOUDS_YAML_B64 (base64 of the clouds.yaml) from openstack.cloudsYAML
# (or the standard OpenStack locations). identityRef.cloudName selects the entry.
apiVersion: v1
kind: Secret
metadata:
  name: "${CLUSTER_NAME}-cloud-config"
  namespace: "${NAMESPACE}"
  labels:
    clusterctl.cluster.x-k8s.io/move: "true"
type: Opaque
data:
  clouds.yaml: "${OPENSTACK_CLOUDS_YAML_B64}"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: OpenStackCluster
metadata:
  name: "${CLUSTER_NAME}"
spec:
  identityRef:
    name: "${CLUSTER_NAME}-cloud-config"
    cloudName: "${OPENSTACK_CLOUD}"
  # Bring your own network: the existing Neutron network klotho booted node zero
  # on. CAPO attaches each machine's default port to it.
  network:
    id: "${OPENSTACK_NETWORK_ID}"
  externalNetwork:
    id: "${OPENSTACK_EXTERNAL_NETWORK_ID}"
  # No Octavia load balancer. The endpoint is the floating IP klotho allocated
  # and associated with node zero; CAPO keeps it associated after adoption.
  apiServer:
    enableFloatingIP: true
    floatingIP: "${OPENSTACK_CONTROL_PLANE_FLOATING_IP}"
    managedLoadBalancer:
      enabled: false
  managedSecurityGroups:
    allowAllInClusterTraffic: true
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlane
metadata:
  name: "${CLUSTER_NAME}-control-plane"
spec:
  replicas: ${CONTROL_PLANE_MACHINE_COUNT}
  version: "${KUBERNETES_VERSION}"
  machineTemplate:
    spec:
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: OpenStackMachineTemplate
        name: "${CLUSTER_NAME}-control-plane"
  kubeadmConfigSpec:
    initConfiguration:
      nodeRegistration:
        name: '{{ local_hostname }}'
        kubeletExtraArgs:
        # Give the kubelet its OpenStack providerID directly, so Cluster API
        # binds the Node to its OpenStackMachine with no cloud controller
        # manager. The empty region matches the providerID CAPO sets when
        # identityRef.region is unset. ds.meta_data.uuid is the Nova server UUID.
        - name: provider-id
          value: 'openstack:///{{ ds.meta_data.uuid }}'
    joinConfiguration:
      nodeRegistration:
        name: '{{ local_hostname }}'
        kubeletExtraArgs:
        - name: provider-id
          value: 'openstack:///{{ ds.meta_data.uuid }}'
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: OpenStackMachineTemplate
metadata:
  name: "${CLUSTER_NAME}-control-plane"
spec:
  template:
    spec:
      flavor:
        filter:
          name: "${OPENSTACK_CONTROL_PLANE_MACHINE_FLAVOR}"
      image:
        filter:
          name: "${OPENSTACK_IMAGE_NAME}"
      sshKeyName: "${OPENSTACK_SSH_KEY_NAME}"
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: "${CLUSTER_NAME}-md-0"
spec:
  clusterName: "${CLUSTER_NAME}"
  replicas: ${WORKER_MACHINE_COUNT}
  selector:
    matchLabels: null
  template:
    spec:
      clusterName: "${CLUSTER_NAME}"
      version: "${KUBERNETES_VERSION}"
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: KubeadmConfigTemplate
          name: "${CLUSTER_NAME}-md-0"
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: OpenStackMachineTemplate
        name: "${CLUSTER_NAME}-md-0"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: OpenStackMachineTemplate
metadata:
  name: "${CLUSTER_NAME}-md-0"
spec:
  template:
    spec:
      flavor:
        filter:
          name: "${OPENSTACK_NODE_MACHINE_FLAVOR}"
      image:
        filter:
          name: "${OPENSTACK_IMAGE_NAME}"
      sshKeyName: "${OPENSTACK_SSH_KEY_NAME}"
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  name: "${CLUSTER_NAME}-md-0"
spec:
  template:
    spec:
      joinConfiguration:
        nodeRegistration:
          name: '{{ local_hostname }}'
          kubeletExtraArgs:
          - name: provider-id
            value: 'openstack:///{{ ds.meta_data.uuid }}'

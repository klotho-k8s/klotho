# klotho flat, cost-safe AWS (CAPA) cluster template.
#
# It is authored in the Cluster API v1beta2 contract (object references use
# apiGroup, not apiVersion), which is what klotho's generator requires, and it
# is deliberately cheap to run:
#   * controlPlaneLoadBalancer.loadBalancerType: disabled - no managed NLB/ELB.
#     klotho boots node zero with an Elastic IP and patches it onto the
#     AWSCluster's spec.controlPlaneEndpoint; with the LB disabled CAPA waits
#     for that endpoint instead of creating (and billing for) a load balancer.
#   * Bring-your-own network - an existing public subnet with an internet
#     gateway and NO NAT gateway, so there is nothing hourly to pay for.
#   * publicIP + spotMarketOptions on every machine - spot pricing, and a public
#     IP so a node in the public subnet reaches the internet with no NAT.
#   * cloudInit.insecureSkipSecretsManager - bootstrap data rides EC2 user-data
#     instead of AWS Secrets Manager, so no Secrets Manager IAM/API is needed.
#
# klotho fills CLUSTER_NAME, NAMESPACE, KUBERNETES_VERSION,
# CONTROL_PLANE_MACHINE_COUNT and WORKER_MACHINE_COUNT itself, and the AWS
# provider's Prepare fills AWS_REGION, AWS_SSH_KEY_NAME,
# AWS_CONTROL_PLANE_MACHINE_TYPE, AWS_NODE_MACHINE_TYPE, AWS_AMI_ID, AWS_VPC_ID
# and AWS_SUBNET_ID. Nothing else needs to be supplied.
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  labels:
    ccm: external
  name: "${CLUSTER_NAME}"
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
      - 192.168.0.0/16
  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io
    kind: KubeadmControlPlane
    name: "${CLUSTER_NAME}-control-plane"
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: AWSCluster
    name: "${CLUSTER_NAME}"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: AWSCluster
metadata:
  name: "${CLUSTER_NAME}"
spec:
  # No managed load balancer: klotho supplies the control plane endpoint (an
  # Elastic IP on node zero), so CAPA never provisions an NLB/ELB.
  controlPlaneLoadBalancer:
    loadBalancerType: disabled
  # Bring your own network: an existing public subnet + internet gateway, no NAT.
  network:
    vpc:
      id: "${AWS_VPC_ID}"
    subnets:
    - id: "${AWS_SUBNET_ID}"
  region: "${AWS_REGION}"
  sshKeyName: "${AWS_SSH_KEY_NAME}"
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlane
metadata:
  name: "${CLUSTER_NAME}-control-plane"
spec:
  kubeadmConfigSpec:
    clusterConfiguration:
      apiServer:
        extraArgs:
        - name: cloud-provider
          value: external
      controllerManager:
        extraArgs:
        - name: cloud-provider
          value: external
    initConfiguration:
      nodeRegistration:
        kubeletExtraArgs:
        - name: cloud-provider
          value: external
        name: '{{ ds.meta_data.local_hostname }}'
    joinConfiguration:
      nodeRegistration:
        kubeletExtraArgs:
        - name: cloud-provider
          value: external
        name: '{{ ds.meta_data.local_hostname }}'
  machineTemplate:
    spec:
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: AWSMachineTemplate
        name: "${CLUSTER_NAME}-control-plane"
  replicas: ${CONTROL_PLANE_MACHINE_COUNT}
  version: "${KUBERNETES_VERSION}"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: AWSMachineTemplate
metadata:
  name: "${CLUSTER_NAME}-control-plane"
spec:
  template:
    spec:
      ami:
        id: "${AWS_AMI_ID}"
      iamInstanceProfile: "control-plane.cluster-api-provider-aws.sigs.k8s.io"
      instanceType: "${AWS_CONTROL_PLANE_MACHINE_TYPE}"
      sshKeyName: "${AWS_SSH_KEY_NAME}"
      publicIP: true
      spotMarketOptions: {}
      cloudInit:
        insecureSkipSecretsManager: true
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: "${CLUSTER_NAME}-md-0"
spec:
  clusterName: "${CLUSTER_NAME}"
  replicas: ${WORKER_MACHINE_COUNT}
  selector:
    matchLabels: null
  template:
    spec:
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: KubeadmConfigTemplate
          name: "${CLUSTER_NAME}-md-0"
      clusterName: "${CLUSTER_NAME}"
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: AWSMachineTemplate
        name: "${CLUSTER_NAME}-md-0"
      version: "${KUBERNETES_VERSION}"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: AWSMachineTemplate
metadata:
  name: "${CLUSTER_NAME}-md-0"
spec:
  template:
    spec:
      ami:
        id: "${AWS_AMI_ID}"
      iamInstanceProfile: nodes.cluster-api-provider-aws.sigs.k8s.io
      instanceType: "${AWS_NODE_MACHINE_TYPE}"
      sshKeyName: "${AWS_SSH_KEY_NAME}"
      publicIP: true
      spotMarketOptions: {}
      cloudInit:
        insecureSkipSecretsManager: true
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  name: "${CLUSTER_NAME}-md-0"
spec:
  template:
    spec:
      joinConfiguration:
        nodeRegistration:
          kubeletExtraArgs:
          - name: cloud-provider
            value: external
          name: '{{ ds.meta_data.local_hostname }}'
---
# Node init needs the AWS cloud controller manager because the kubelets run with
# cloud-provider=external (the in-tree AWS provider is gone). The CRS applies it
# once the API server is up. CSI is intentionally omitted: a throwaway test
# cluster does not need EBS volumes, and leaving it out keeps the bundle small.
apiVersion: addons.cluster.x-k8s.io/v1beta1
kind: ClusterResourceSet
metadata:
  name: "${CLUSTER_NAME}-crs-ccm"
spec:
  clusterSelector:
    matchLabels:
      ccm: external
  resources:
  - kind: ConfigMap
    name: "${CLUSTER_NAME}-ccm"
  strategy: ApplyOnce
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "${CLUSTER_NAME}-ccm"
data:
  aws-ccm-external.yaml: |
    ---
    apiVersion: apps/v1
    kind: DaemonSet
    metadata:
      name: aws-cloud-controller-manager
      namespace: kube-system
      labels:
        k8s-app: aws-cloud-controller-manager
    spec:
      selector:
        matchLabels:
          k8s-app: aws-cloud-controller-manager
      updateStrategy:
        type: RollingUpdate
      template:
        metadata:
          labels:
            k8s-app: aws-cloud-controller-manager
        spec:
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          tolerations:
            - key: node.cloudprovider.kubernetes.io/uninitialized
              value: "true"
              effect: NoSchedule
            - key: node-role.kubernetes.io/control-plane
              effect: NoSchedule
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: Exists
          serviceAccountName: cloud-controller-manager
          containers:
            - name: aws-cloud-controller-manager
              image: registry.k8s.io/provider-aws/cloud-controller-manager:v1.28.3
              args:
                - --v=2
                - --cloud-provider=aws
                - --use-service-account-credentials=true
                - --configure-cloud-routes=false
              resources:
                requests:
                  cpu: 200m
          hostNetwork: true
    ---
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: cloud-controller-manager
      namespace: kube-system
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: system:cloud-controller-manager
    rules:
    - apiGroups: [""]
      resources: ["events"]
      verbs: ["create", "patch", "update"]
    - apiGroups: [""]
      resources: ["nodes"]
      verbs: ["*"]
    - apiGroups: [""]
      resources: ["nodes/status"]
      verbs: ["patch"]
    - apiGroups: [""]
      resources: ["services"]
      verbs: ["list", "patch", "update", "watch"]
    - apiGroups: [""]
      resources: ["services/status"]
      verbs: ["list", "patch", "update", "watch"]
    - apiGroups: [""]
      resources: ["serviceaccounts"]
      verbs: ["create", "get", "list", "watch"]
    - apiGroups: [""]
      resources: ["persistentvolumes"]
      verbs: ["get", "list", "update", "watch"]
    - apiGroups: [""]
      resources: ["endpoints"]
      verbs: ["create", "get", "list", "watch", "update"]
    - apiGroups: ["coordination.k8s.io"]
      resources: ["leases"]
      verbs: ["create", "get", "list", "watch", "update"]
    - apiGroups: [""]
      resources: ["serviceaccounts/token"]
      verbs: ["create"]
    ---
    kind: ClusterRoleBinding
    apiVersion: rbac.authorization.k8s.io/v1
    metadata:
      name: system:cloud-controller-manager
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: system:cloud-controller-manager
    subjects:
      - apiGroup: ""
        kind: ServiceAccount
        name: cloud-controller-manager
        namespace: kube-system
